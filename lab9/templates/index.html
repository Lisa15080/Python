<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ myapp }}</title>
</head>
<body>
    <header>
        <h1>{{ myapp }}</h1>
        <p>Автор проекта: {{ author_name }}</p>
        <p>Группа: {{ group }}</p>
    </header>

    <nav id="navigation">
        <ul>
        {% for item in navigation %}
            <li><a href="{{ item.href }}">{{ item.caption }}</a></li>
        {% endfor %}
        </ul>
    </nav>
</body>
</html>
